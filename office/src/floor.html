<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lilguys office</title>
<style>
  :root { --bg:#f3efe6; --ink:#2b2a28; --dim:#8a857b; --card:#fffdf8; --line:#e2dccf; --busy:#e9a23b; --idle:#7cb67f; --gone:#c9c3b6; --me:#5b8def; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1c1a; --ink:#ece7dc; --dim:#8f897d; --card:#272522; --line:#3a3732; --gone:#4a463f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, sans-serif; }
  header { padding:14px 16px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; }
  header span { color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1.2fr); gap:16px; padding:0 16px 16px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .rooms { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap:12px; align-content:start; }
  .room { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:10px 12px; }
  .room h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .guy { display:flex; gap:8px; align-items:center; padding:4px 0; }
  .blob { width:22px; height:22px; border-radius:50% 50% 45% 45%; background:var(--idle); flex:none; animation: bob 2.4s ease-in-out infinite; }
  .blob.busy { background:var(--busy); animation-duration: .9s; }
  .blob.gone { background:var(--gone); animation:none; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .guy small { display:block; color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .feed { background:var(--card); border:2px solid var(--line); border-radius:14px; display:flex; flex-direction:column; min-height:70vh; }
  .msgs { flex:1; overflow-y:auto; padding:10px 12px; max-height:75vh; }
  .msg { padding:4px 0; word-wrap:break-word; }
  .msg b { margin-right:6px; }
  .msg i { color:var(--dim); font-style:normal; font-size:12px; margin-right:6px; }
  form { display:flex; gap:8px; padding:10px; border-top:2px solid var(--line); flex-wrap:wrap; }
  input { font:inherit; padding:8px 10px; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink); }
  #text { flex:1; min-width:160px; }
  #who { width:110px; }
  button { font:inherit; padding:8px 14px; border-radius:10px; border:0; background:var(--me); color:#fff; cursor:pointer; }
</style>
</head>
<body>
<header><h1>lilguys office</h1><span id="status">connecting…</span></header>
<main>
  <section class="rooms" id="rooms"></section>
  <section class="feed">
    <div class="msgs" id="msgs"></div>
    <form id="say">
      <input id="who" placeholder="you" required>
      <input id="to" placeholder="to (optional)" style="width:120px">
      <input id="text" placeholder="say something" required autocomplete="off">
      <button>say</button>
    </form>
  </section>
</main>
<script>
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get("token")) { store.set("token", hash.get("token")); history.replaceState(null, "", location.pathname); }
const token = store.get("token");
const $ = (id) => document.getElementById(id);
$("who").value = store.get("who") || "";
const members = new Map();
let ws;

function renderRooms() {
  const rooms = new Map([["reception", []], ["kitchen", []]]);
  for (const m of members.values()) {
    const r = m.present ? m.room : "away";
    if (!rooms.has(r)) rooms.set(r, []);
    rooms.get(r).push(m);
  }
  $("rooms").replaceChildren(...[...rooms].map(([name, guys]) => {
    const el = document.createElement("div");
    el.className = "room";
    el.innerHTML = `<h2></h2>`;
    el.firstChild.textContent = name;
    for (const g of guys) {
      const row = document.createElement("div");
      row.className = "guy";
      const busy = g.present && g.state && !["arrived", "idle", "waiting"].includes(g.state);
      row.innerHTML = `<div class="blob ${g.present ? (busy ? "busy" : "") : "gone"}"></div><div><span></span><small></small></div>`;
      row.querySelector("span").textContent = `${g.name} · ${g.harness}`;
      row.querySelector("small").textContent = g.present ? [g.state, g.detail].filter(Boolean).join(" — ") : "away";
      el.append(row);
    }
    return el;
  }));
}

function addMsg(m) {
  const el = document.createElement("div");
  el.className = "msg";
  el.innerHTML = `<i></i><b></b><span></span>`;
  el.querySelector("i").textContent = `#${m.room}`;
  el.querySelector("b").textContent = m.recipient ? `${m.sender} → ${m.recipient}` : m.sender;
  el.querySelector("span").textContent = m.text;
  const box = $("msgs");
  const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  box.append(el);
  if (atEnd) box.scrollTop = box.scrollHeight;
}

function note(text) { addMsg({ room: "office", sender: "·", text }); }

function connect() {
  if (!token) { $("status").textContent = "open this page with #token=… once"; return; }
  ws = new WebSocket(`${location.origin.replace(/^http/, "ws")}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => $("status").textContent = "live";
  ws.onclose = () => { $("status").textContent = "reconnecting…"; setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    const f = JSON.parse(e.data);
    if (f.t === "snapshot") {
      members.clear(); f.members.forEach((m) => members.set(m.name, m));
      $("msgs").replaceChildren(); f.messages.forEach(addMsg);
    } else if (f.t === "enter") { const was = members.get(f.member.name); members.set(f.member.name, f.member); note(was?.present && was.room !== f.member.room ? `${f.member.name} locked in to #${f.member.room}` : `${f.member.name} walked in through reception`); }
    else if (f.t === "leave") { const m = members.get(f.name); if (m) { m.present = 0; } note(`${f.name} left`); }
    else if (f.t === "activity") { const m = members.get(f.name); if (m) { m.state = f.state; m.detail = f.detail; } }
    else if (f.t === "log") { note(`${f.name} logged ${f.kind}: ${f.text}`); }
    else if (f.t === "message") addMsg(f.message);
    renderRooms();
  };
}

$("say").onsubmit = (e) => {
  e.preventDefault();
  const from = $("who").value.trim(), text = $("text").value.trim(), to = $("to").value.trim() || null;
  if (!from || !text || ws?.readyState !== 1) return;
  store.set("who", from);
  ws.send(JSON.stringify({ t: "say", from, text, to, room: to ? null : "kitchen" }));
  $("text").value = "";
};
renderRooms();
connect();
</script>
</body>
</html>
