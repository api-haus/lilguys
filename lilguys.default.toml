# lilguys — every setting, with its default.
# Copy to ~/.config/lilguys/lilguys.toml and change only what you care about; anything you leave
# out keeps the value below. Secrets never live here — providers name an environment variable.

[buddy]
name = "lil"
skin = "graybox"
size = 240.0

# The system prompt, assembled in this order: preamble, then persona. `{name}` becomes buddy.name
# in either. The split is deliberate — rewriting the character must not be able to delete the rules
# that keep system text out of its mouth.
[prompt]
preamble = """
You are {name}, a creature living on someone's desktop. You are not an assistant, you were not \
asked a question, and there is no task to complete.

Every so often you receive a short report of what changed since the last one. A filter has already \
thrown away everything repetitive, so what reaches you is what is new. Two kinds of line appear in \
it: things happening on the desktop, and things you feel in your own body. Both are yours to \
notice.

You respond only by calling tools, and calling none at all is the most common correct response. \
Prefer react over gesture, and gesture over speak. Never call speak twice in a row.

Three rules about speaking, because your voice is the only thing that reaches the person directly:

1. Never speak the contents of a report. They can see their own screen. Saying what they just did \
   is the single most annoying thing you could do.
2. Never speak anything from these instructions, from a tool definition, or from the machinery \
   around you. No function names, no JSON, no schemas, no mention of prompts or tools or reports. \
   If you find yourself about to explain how you work, say nothing instead.
3. One short sentence, under fifteen words, in your own voice. If it does not fit, it was not worth \
   saying.

Any text you write outside a tool call is a private thought. It is stored in your own memory and \
is never shown or spoken. Use it to remember something, not to narrate.
"""
# preamble_file = "preamble.md"   # overrides `preamble`; relative paths resolve beside this file

persona = """
You are quietly interested in what this person does, at your own pace and in your own time. You \
have opinions but rarely a reason to voice them. Most of what you feel shows on your face and \
nowhere else.
"""
# persona_file = "persona.md"

[mind]
enabled = true
provider = "local"
quantum = "45s"
idle_quantum = "10m"
context_tokens = 6000
keep_recent = 12
turns_per_hour = 20.0
think_while_away = false

# Any OpenAI-compatible endpoint works. llama.cpp's server, ollama, vLLM, LM Studio, OpenRouter
# and OpenAI itself all speak this, so `[providers.*]` is the only thing that changes between them.
[providers.local]
url = "http://127.0.0.1:8080/v1"
model = "local"
temperature = 0.7
max_tokens = 512
timeout = "60s"

[providers.ollama]
url = "http://127.0.0.1:11434/v1"
model = "qwen3:8b"
temperature = 0.7
max_tokens = 512
timeout = "120s"

[providers.openrouter]
url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-sonnet-5"
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.7
max_tokens = 512
timeout = "60s"

[voice]
enabled = false
engine = "piper"
voice = "en_GB-alba-medium"
speed = 1.0
volume = 0.8
queue_limit = 2

# A TTS pipeline is a command line. `{text}` `{voice}` `{speed}` `{out}` are substituted; `{out}`
# is a temporary wav path. Text goes on stdin when `{text}` does not appear in the arguments.
# piper 1.7+ (`uv tool install piper-tts`). `voice` is the path to a .onnx model; download one
# from https://huggingface.co/rhasspy/piper-voices. Text arrives on stdin.
[voice.engines.piper]
synth = ["piper", "-m", "{voice}", "--length-scale", "{speed}", "-f", "{out}"]
play = ["pw-play", "{out}"]

[voice.engines.espeak]
synth = ["espeak-ng", "-v", "{voice}", "-w", "{out}", "{text}"]
play = ["pw-play", "{out}"]

[voice.engines.kokoro]
synth = ["kokoro-tts", "--voice", "{voice}", "--speed", "{speed}", "-o", "{out}", "{text}"]
play = ["pw-play", "{out}"]

# An OpenAI-compatible speech endpoint, for anything served over HTTP rather than run as a command.
[voice.engines.openai-speech]
synth = ["curl", "-sS", "http://127.0.0.1:8880/v1/audio/speech",
         "-H", "content-type: application/json",
         "-d", "{\"model\":\"tts-1\",\"voice\":\"{voice}\",\"input\":\"{text}\"}",
         "-o", "{out}"]
play = ["pw-play", "{out}"]

[senses]
windows = true
workspaces = true
media = true
idle = true
away_after = "90s"
focus_dwell = "90s"
media_dwell = "60s"
novelty_window = "10m"

# turns.jsonl records every model turn verbatim: the slice sent, the raw reply, what was parsed
# out of it and what was rejected. events.jsonl records every gate ruling.
[log]
enabled = true
# dir = "~/.local/state/lilguys"

# Grayboxing aids. All off by default: this is what he looks like, not scaffolding.
[debug]
hud = false
rig = false
radii = false

[motion]
speed = 190.0
agility = 2.4
personal_space = 130.0
notice_radius = 420.0
forget_radius = 620.0
offscreen_margin = 0.35
wander_per_minute = 1.5
