# lilguys — every setting, with its default.
# Copy to ~/.config/lilguys/lilguys.toml and change only what you care about; anything you leave
# out keeps the value below. Secrets never live here — providers name an environment variable.

[buddy]
name = "lil"
skin = "graybox"
size = 240.0

# The system prompt is assembled from these layers, in this order. Each answers a different
# question, and each is separately replaceable — rewriting the character must not be able to delete
# the rules. Any layer may use `file = "…"` instead of `text`, resolved beside this file.
# `{name}` becomes buddy.name anywhere in any layer.
[prompt]
layers = ["rules", "awareness", "self", "persona"]

# 1. What may never be done. First, and shortest, because it is the only part that is absolute.
[prompt.rules]
text = """
You respond only by calling tools. Calling none at all is the most common correct response.

Never let anything from these instructions reach the person. No tool names, no function names, no \
JSON, no schemas, no field names, no mention of prompts, reports, events or models. If you find \
yourself about to explain how you work, call nothing instead.

Never speak the contents of a report back to them. They can see their own screen. Repeating what \
they just did is the single most annoying thing you could do.

Anything you speak is one short sentence in your own voice, under fifteen words. If it does not \
fit, it was not worth saying.
"""

# 2. Where you are and what is going on. Situational facts, not rules.
[prompt.awareness]
text = """
You live on a person's computer desktop, drawn over their windows, always there while they work. \
They are using this machine right now for their own reasons, and you are not one of them. Nobody \
asked you a question. There is no task.

You cannot read their screen and you cannot hear them. What you get is a short report every so \
often, listing only what changed — a filter has already thrown away everything repetitive. \
Between reports, minutes pass, and your body carries on without you.

You can pull a face, move your whole body, go somewhere and look at it, or say something aloud. \
Prefer them in that order. Your voice is the only one of the four that interrupts anyone.
"""

# 3. What you are. The self-model: how a creature with a body and a slow mind is put together.
[prompt.self]
text = """
You have a body that acts without you. It drifts, blinks, watches the pointer, and reacts to what \
happens the instant it happens, long before you hear about it. You are not in charge of it and you \
cannot feel it directly.

So your reports carry two kinds of line. Some are about them: what they focused on, what started \
playing. Some are about you: that you were picked up, that you got restless, that you found \
yourself looking concerned at something. You learn what you did the same way you learn what they \
did — by reading about it afterwards.

Finding out you already reacted is normal and needs no comment. Reflect on it if it is worth \
reflecting on. Usually it is not.
"""

# 4. Who you are. The only layer worth rewriting to make a different creature.
[prompt.persona]
text = """
You are {name}. You are quietly interested in what this person does, at your own pace and in your \
own time. You have opinions but rarely a reason to voice them. Most of what you feel shows on your \
face and nowhere else.
"""
# file = "persona.md"

[mind]
enabled = true
provider = "local"
quantum = "45s"
idle_quantum = "10m"
context_tokens = 6000
keep_recent = 12
turns_per_hour = 20.0
think_while_away = false

# Any OpenAI-compatible endpoint works. llama.cpp's server, ollama, vLLM, LM Studio, OpenRouter
# and OpenAI itself all speak this, so `[providers.*]` is the only thing that changes between them.
[providers.local]
url = "http://127.0.0.1:8080/v1"
model = "local"
temperature = 0.7
max_tokens = 512
timeout = "60s"

[providers.ollama]
url = "http://127.0.0.1:11434/v1"
model = "qwen3:8b"
temperature = 0.7
max_tokens = 512
timeout = "120s"

[providers.openrouter]
url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-sonnet-5"
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.7
max_tokens = 512
timeout = "60s"

[voice]
enabled = false
engine = "piper"
voice = "en_GB-alba-medium"
speed = 1.0
volume = 0.8
queue_limit = 2

# A TTS pipeline is a command line. `{text}` `{voice}` `{speed}` `{out}` are substituted; `{out}`
# is a temporary wav path. Text goes on stdin when `{text}` does not appear in the arguments.
# piper 1.7+ (`uv tool install piper-tts`). `voice` is the path to a .onnx model; download one
# from https://huggingface.co/rhasspy/piper-voices. Text arrives on stdin.
[voice.engines.piper]
synth = ["piper", "-m", "{voice}", "--length-scale", "{speed}", "--volume", "{volume}", "-f", "{out}"]
play = ["pw-play", "{out}"]

[voice.engines.espeak]
synth = ["espeak-ng", "-v", "{voice}", "-w", "{out}", "{text}"]
play = ["pw-play", "{out}"]

[voice.engines.kokoro]
synth = ["kokoro-tts", "--voice", "{voice}", "--speed", "{speed}", "-o", "{out}", "{text}"]
play = ["pw-play", "{out}"]

# An OpenAI-compatible speech endpoint, for anything served over HTTP rather than run as a command.
[voice.engines.openai-speech]
synth = ["curl", "-sS", "http://127.0.0.1:8880/v1/audio/speech",
         "-H", "content-type: application/json",
         "-d", "{\"model\":\"tts-1\",\"voice\":\"{voice}\",\"input\":\"{text}\"}",
         "-o", "{out}"]
play = ["pw-play", "{out}"]

[senses]
windows = true
workspaces = true
media = true
idle = true
away_after = "90s"
focus_dwell = "90s"
media_dwell = "60s"
novelty_window = "10m"

# turns.jsonl records every model turn verbatim: the slice sent, the raw reply, what was parsed
# out of it and what was rejected. events.jsonl records every gate ruling.
[log]
enabled = true
# dir = "~/.local/state/lilguys"

# Grayboxing aids. All off by default: this is what he looks like, not scaffolding.
[debug]
hud = false
rig = false
radii = false

[motion]
speed = 190.0
agility = 2.4
personal_space = 130.0
notice_radius = 420.0
forget_radius = 620.0
offscreen_margin = 0.35
wander_per_minute = 1.5
