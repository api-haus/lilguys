# Grafana, Prometheus, Tempo and Loki in one container, with OTLP receivers. Development only —
# nothing here ships, and nothing leaves the loopback. See docs/telemetry.md.
services:
  lgtm:
    image: grafana/otel-lgtm:0.30.2
    container_name: lilguys-lgtm
    ports:
      # Grafana. Anonymous admin, because the only visitor is the person who started it.
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      # OTLP over HTTP, which is the one lilguysd speaks.
      - "127.0.0.1:4318:4318"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      # One file, not the directory — mounting the directory hides the image's own providers.
      - ./provisioning/lilguys.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/lilguys.yaml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - lgtm-data:/data
    restart: unless-stopped

volumes:
  lgtm-data:
